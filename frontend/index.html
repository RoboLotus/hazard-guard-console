<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HazardGuard Console</title>
    <style>
      .app-boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #54677d;
        background: #eef2f6;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app-boot-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
      }
      .app-boot-loader__spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #cfd9e4;
        border-top-color: #1769e0;
        border-radius: 50%;
        animation: app-boot-spin .8s linear infinite;
      }
      .app-boot-loader strong { color: #263b51; font-size: 15px; }
      .app-boot-loader span { font-size: 11px; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__spinner { animation: none; border-top-color: #cfd9e4; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite">
        <div class="app-boot-loader__content">
          <span class="app-boot-loader__spinner" aria-hidden="true"></span>
          <strong>HazardGuard Console</strong>
          <span>관제 화면을 준비하고 있습니다.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
